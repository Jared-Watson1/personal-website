services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8042:8000"
    command: "-jar DynamoDBLocal.jar -inMemory"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    volumes:
      - ./backend:/app
